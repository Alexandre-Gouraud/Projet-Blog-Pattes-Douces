name: Accessibility E2E

on:
  push:
    branches: [main, development]
    paths: &app-files
      - 'blog-pattes-douces/**'
      - '!blog-pattes-douces/**.md'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, development]
    paths: *app-files

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    working-directory: blog-pattes-douces

jobs:
  e2e:
    name: Playwright + axe
    # mongo:8.0 refuse de demarrer sur un noyau Linux 6.19 ou plus recent
    # (SERVER-121912) : ubuntu-latest (26.04) et ubuntu-24.04 sont en 7.0,
    # ubuntu-22.04 en 6.8. Revenir a ubuntu-latest des qu'une image 8.0 corrigee existe.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read # recuperer le code

    env:
      # Base jetable de la CI (replica set demarre par docker compose).
      DATABASE_URL: mongodb://localhost:27017/pattes-douces-e2e?replicaSet=rs0&directConnection=true
      # Le serveur de test est en http : le cookie de session ne peut pas etre Secure.
      COOKIE_SECURE: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version lue dans le champ "packageManager" de package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: blog-pattes-douces/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: blog-pattes-douces/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      # MongoDB 8 en replica set, comme en local (compose.yaml).
      - name: Start MongoDB
        run: pnpm db:up

      - name: Create indexes
        run: pnpm db:push

      - name: Seed test data
        run: node scripts/e2e-seed.mjs

      # Les modeles de traduction ne sont pas necessaires : pas de translation:setup.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Playwright construit puis demarre l'application (webServer), voir playwright.config.ts.
      - name: Run accessibility tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            blog-pattes-douces/playwright-report/
            blog-pattes-douces/test-results/
          retention-days: 7
          if-no-files-found: ignore
