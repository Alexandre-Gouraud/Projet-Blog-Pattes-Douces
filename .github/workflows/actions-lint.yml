name: Actions & CI Files

on:
  push:
    branches: [main, development]
    paths: &ci-files
      - '.github/workflows/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main, development]
    paths: *ci-files
  schedule:
    - cron: '0 5 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: Lint workflows (actionlint)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # lire les workflows
      pull-requests: write # commenter la PR (reporter github-pr-review)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          reporter: github-pr-review

  zizmor:
    name: Security scan (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read # lire les workflows
      actions: read # lire les metadonnees des workflows
      security-events: write # publier les resultats dans l'onglet Security

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
